[project]
name = "jatri-backend"
version = "0.1.0"
description = "Bangla AI-powered Migrant Worker Assistance Platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "mcp[cli]>=2.3.0",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.5",
]
